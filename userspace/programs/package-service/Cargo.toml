[package]
name = "serviceos-package-service"
version = "0.1.0"
edition = "2024"

[lib]
name = "serviceos_package_service"
path = "src/lib.rs"
test = true

[[bin]]
name = "serviceos-package-service"
path = "src/main.rs"

[dependencies]
serviceos-abi = { path = "../../../shared/abi" }
serviceos-bundle = { path = "../../../shared/bundle" }
serviceos-crypto = { path = "../../../shared/crypto" }
serviceos-userspace-runtime = { path = "../runtime" }

[dev-dependencies]
# Host-only fixtures (keypair generation / feed signing) for the signing
# module's Ed25519 roundtrip tests.
serviceos-crypto = { path = "../../../shared/crypto", features = ["std-helper"] }
