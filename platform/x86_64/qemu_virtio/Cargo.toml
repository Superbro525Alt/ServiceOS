[package]
name = "serviceos-platform-qemu-virtio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
serviceos-abi = { path = "../../../shared/abi" }
serviceos-crypto = { path = "../../../shared/crypto" }
serviceos-wireless = { path = "../../../shared/wireless" }
serviceos-kernel-core = { path = "../../../kernel/core" }
serviceos-kernel-arch-x86_64 = { path = "../../../arch/x86_64" }
spin = "0.9"
uefi = { version = "0.33", default-features = false }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
